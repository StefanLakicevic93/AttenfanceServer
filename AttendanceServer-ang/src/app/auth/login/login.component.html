<div class="center-form">
    <h2>Enter Your Credentials</h2>

    <form nz-form class="custom-form" [formGroup]="loginForm" (ngSubmit)="login()">

        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your email!">
                <nz-input-group nzPrefixIcon="user">
                    <input type="text" nz-input formControlName="email" placeholder="E-mail"/>
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>

        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your password!">
                <nz-input-group nzPrefixIcon="lock">
                    <input type="password" nz-input formControlName="password" placeholder="Password"/>
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>

        <button nz-button nzType="primary" nzBlock class="w-100"
        [disabled]="loginForm.invalid">Login</button>

    </form>

</div>
