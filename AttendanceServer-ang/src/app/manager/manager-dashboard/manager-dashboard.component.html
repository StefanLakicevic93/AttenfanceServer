<div style="padding: 30px;">
    <h3>Mark today's attendance</h3>

    <nz-table #basicTable [nzData]="employeeDetails">

        <thead>
            <tr>
                <th>Name</th>
                <th>Project Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let data of basicTable.data">
                <td>{{data.name}}</td>
                <td>{{data.projectName}}</td>
                <td>{{data.email}}</td>
                <td>
                    <button nz-button nzType="primary" (click)="markAttendance('PRESENT', data.id, data.projectId)">
                        Present
                    </button>
                    <nz-divider nzType="vertical"></nz-divider>
                    <button nz-button nzType="primary" nzDanger (click)="markAttendance('ABSENT', data.id, data.projectId)">
                        Absent
                    </button>
                    <nz-divider nzType="vertical"></nz-divider>
                    <button nz-button nzType="default" (click)="markAttendance('LEAVE', data.id, data.projectId)">
                        Leave
                    </button>
                </td>
            </tr>
        </tbody>

    </nz-table>

</div>
